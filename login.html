<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Kobe Oriental</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="auth-body">


    <div class="auth-container">


        <div class="auth-logo">

            🍣

            <span>
                KOBE
                <small>
                    ORIENTAL FOOD
                </small>
            </span>

        </div>


        <h1>
            Bem-vindo!
        </h1>


        <p class="auth-subtitle">
            Entre na sua conta
        </p>


        <form id="loginForm">


            <label>
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >


            <label>
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >


            <button type="submit">

                ENTRAR

            </button>


        </form>


        <p class="auth-link">

            Ainda não possui uma conta?

            <a href="cadastro.html">
                Criar conta
            </a>

        </p>


        <a href="index.html"
           class="back-home">

            ← Voltar para o início

        </a>


    </div>


    <script src="script.js"></script>

</body>

</html>
