<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Kobe Oriental</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="auth-body">


    <div class="auth-container">


        <div class="auth-logo">

            🍣

            <span>
                KOBE
                <small>
                    ORIENTAL FOOD
                </small>
            </span>

        </div>


        <h1>
            Criar conta
        </h1>


        <p class="auth-subtitle">

            Cadastre-se para fazer seus pedidos

        </p>


        <form id="cadastroForm">


            <label>
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >


            <label>
                E-mail
            </label>

            <input
                type="email"
                id="emailCadastro"
                placeholder="Digite seu e-mail"
                required
            >


            <label>
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                placeholder="(11) 99999-9999"
                required
            >


            <label>
                Senha
            </label>

            <input
                type="password"
                id="senhaCadastro"
                placeholder="Crie uma senha"
                required
            >


            <label>
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Digite novamente"
                required
            >


            <button type="submit">

                CRIAR CONTA

            </button>


        </form>


        <p class="auth-link">

            Já possui uma conta?

            <a href="login.html">
                Entrar
            </a>

        </p>


        <a href="index.html"
           class="back-home">

            ← Voltar para o início

        </a>


    </div>


    <script src="script.js"></script>

</body>

</html>
